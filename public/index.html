        .luxury-card {

        @keyframes luxuryGoldGlow {

                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 10px rgba(73, 212, 55, 0.2), inset 0 0 10px rgba(99, 212, 55, 0.1)

            }

                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 10px rgba(73, 212, 55, 0.2), inset 0 0 10px rgba(99, 212, 55, 0.1)
